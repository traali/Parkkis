# Lefthook - Sovereign Monastic Quality Gate for ParkkiS
pre-commit:
  parallel: true
  commands:
    anti-slop-tokens:
      run: node scripts/git-guard.mjs tokens {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,mjs}"
    secrets:
      run: node scripts/git-guard.mjs secrets {staged_files}
      glob: "*"
    lint:
      run: npx @biomejs/biome lint {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,mjs}"

commit-msg:
  commands:
    conventional-commit:
      run: node scripts/git-guard.mjs commit-msg {1}

pre-push:
  parallel: false
  commands:
    sovereign-check:
      run: npm run check
