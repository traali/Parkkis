name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
            web/package-lock.json

      - name: Install Engine Dependencies
        run: |
          cd engine
          npm install

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache fetched parking data
        uses: actions/cache@v4
        id: data-cache
        with:
          path: engine/.cache
          key: parking-data-${{ steps.date.outputs.date }}
          restore-keys: |
            parking-data-

      - name: Fetch external data
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: npm run fetch

      - name: Process fetched data
        run: npm run process

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Build Web Dashboard
        run: |
          cd web
          npm run lint
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/dist
          branch: gh-pages
