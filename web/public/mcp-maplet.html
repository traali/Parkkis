<!DOCTYPE html>
<html lang="fi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkkiS MCP App Maplet</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    :root {
      --nv-bg-canvas: #090d16;
      --nv-bg-surface: #111827;
      --nv-text-primary: #f9fafb;
      --nv-text-muted: #9ca3af;
      --nv-pitch: #10b981;
      --nv-whistle: #f59e0b;
      --nv-stoppage: #ef4444;
      --nv-border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--nv-bg-canvas);
      color: var(--nv-text-primary);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 14px;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--nv-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }
    .badge-safe { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-moderate { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-trap { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    #map { flex: 1; width: 100%; height: 100%; }
    footer {
      padding: 8px 14px;
      background: rgba(17, 24, 39, 0.9);
      border-top: 1px solid var(--nv-border);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      color: var(--nv-text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div style="font-size: 13px; font-weight: 700;" id="venueTitle">ParkkiS Pysäköintiturvallisuus</div>
      <div style="font-size: 11px; color: var(--nv-text-muted);" id="zoneDetails">Ladataan alueen tietoja...</div>
    </div>
    <div id="riskBadge" class="badge badge-safe">Lasketaan...</div>
  </header>

  <div id="map"></div>

  <footer>
    <span>🅿️ 165k pysäköintivirhettä & PMTiles</span>
    <span id="walkTime">~3 min kävely</span>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const venue = params.get('venue') || 'Kenttä';
    const lat = parseFloat(params.get('lat') || '60.187');
    const lng = parseFloat(params.get('lng') || '24.928');
    const risk = parseInt(params.get('risk') || '3', 10);

    document.getElementById('venueTitle').textContent = `🅿️ ${venue}`;
    document.getElementById('zoneDetails').textContent = `Koordinaatit: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;

    const riskBadge = document.getElementById('riskBadge');
    if (risk >= 7) {
      riskBadge.className = 'badge badge-trap';
      riskBadge.textContent = `Riski ${risk}/10 ⚠️`;
    } else if (risk >= 4) {
      riskBadge.className = 'badge badge-moderate';
      riskBadge.textContent = `Riski ${risk}/10 🟡`;
    } else {
      riskBadge.className = 'badge badge-safe';
      riskBadge.textContent = `Riski ${risk}/10 🟢`;
    }

    // Initialize MapLibre GL Map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [lng, lat],
      zoom: 16,
      pitch: 45
    });

    map.on('load', () => {
      new maplibregl.Marker({ color: risk >= 7 ? '#ef4444' : '#10b981' })
        .setLngLat([lng, lat])
        .setPopup(new maplibregl.Popup().setHTML(`<b>${venue}</b><br>Pysäköintiriski: ${risk}/10`))
        .addTo(map);
    });

    // MCP Ext-Apps JSON-RPC postMessage Bridge (2026 Specification)
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'mcp:init') {
        window.parent.postMessage({ type: 'mcp:ready', protocolVersion: '2026-01' }, '*');
      }
    });
  </script>
</body>
</html>
